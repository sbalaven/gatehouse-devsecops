<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gatehouse / Security workspace</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header><a class="brand" href="{{ url_for('index') }}"><span class="mark">G</span> Gatehouse<span class="edition"> / DEVSECOPS LAB</span></a>
  {% if g.user %}<form action="{{ url_for('logout') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><span class="user">{{ g.user['username'] }}</span><button class="quiet" type="submit">Sign out</button></form>{% else %}<span class="edition">BUILD. CHECK. RELEASE.</span>{% endif %}</header>
  <main>{% for message in get_flashed_messages() %}<div class="notice" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main>
  <footer>GATEHOUSE <span>Security engineering, made observable.</span><span>Portfolio lab · local data</span></footer>
</body>
</html>
