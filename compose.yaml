services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Generate and export SECRET_KEY first; see README}
      TRUSTED_HOSTS: localhost,127.0.0.1
    volumes:
      - gatehouse-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  gatehouse-data:
